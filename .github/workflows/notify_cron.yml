name: Send Firebase Push Notifications (Cron)

on:
  # Schedule rimosso: triggering esterno via cron-job.org ogni 5 min (workflow_dispatch)
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check_reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Log server time
        run: |
          echo "Server UTC time: $(date -u)"

      - name: Checkout Repository
        # NOTE: workflow_dispatch sul default branch (main) checkoutava main. Il
        # server code più aggiornato (filtri snooze/mute, opt-in collaboratori)
        # vive in develop. Mantenere ref=develop finché non viene mergiato in
        # main per il go-live prod.
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          
      - name: Install dependencies
        working-directory: ./server
        run: npm ci

      - name: Run Reminder Script
        working-directory: ./server
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GITHUB_ACTIONS: "true"
        run: node index.js
