name: Deploy Angular App to Firebase Hosting

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:
    inputs:
      changelog_title:
        description: 'Notification title (optional — leave empty to skip notification)'
        required: false
        default: ''
      changelog_body:
        description: 'Notification body / changelog (optional — leave empty to skip notification)'
        required: false
        default: ''

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Inject build version (git short SHA)
        working-directory: ./frontend
        run: |
          VERSION=$(git rev-parse --short HEAD)
          echo "{\"version\":\"$VERSION\"}" > src/version.json
          sed -i "s/appVersion: '[^']*'/appVersion: '$VERSION'/" src/environments/environment.ts

      - name: Build Angular App for Firebase (base-href /)
        working-directory: ./frontend
        run: npm run build -- --configuration production --base-href / --output-path dist/firebase

      - name: Deploy Firestore rules
        continue-on-error: true
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PUNTO_84646 }}' > /tmp/sa.json
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json npx firebase-tools@latest deploy --only firestore:rules --project punto-84646 --non-interactive

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PUNTO_84646 }}
          projectId: punto-84646
          channelId: live
          target: production

      - name: Build Angular App for GitHub Pages (base-href /punto-/)
        working-directory: ./frontend
        run: npm run build -- --configuration production --base-href /punto-/ --output-path dist/ghpages

      - name: Deploy to GitHub Pages (release_pages branch)
        run: |
          cd frontend/dist/ghpages/browser
          touch .nojekyll
          cp index.html 404.html
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git init
          git add .
          git commit -m "deploy: $(cd ../../../.. && git log -1 --pretty=format:'%s')"
          git push --force https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:release_pages

      - name: Send changelog notification (if provided)
        if: ${{ inputs.changelog_title != '' && inputs.changelog_body != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run notify-all-users.yml \
            --repo ${{ github.repository }} \
            -f title="${{ inputs.changelog_title }}" \
            -f body="${{ inputs.changelog_body }}"
