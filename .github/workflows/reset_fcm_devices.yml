name: Reset FCM Devices (One-shot)

on:
  workflow_dispatch:
    inputs:
      target_uid:
        description: 'UID dell utente da resettare (cancella fcmDevices + fcmTokens)'
        required: true
        default: 'W42XL7UVYFRMakpZJdrpcGkgsQr1'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: ./server
        run: npm ci

      - name: Reset fcmDevices + fcmTokens
        working-directory: ./server
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GITHUB_ACTIONS: "true"
          TARGET_UID: ${{ inputs.target_uid }}
        run: |
          node -e "
          const admin = require('firebase-admin');
          admin.initializeApp({ credential: admin.credential.cert(JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT)) });
          const db = admin.firestore();
          const uid = process.env.TARGET_UID;
          db.collection('users').doc(uid).get().then(async doc => {
            if (!doc.exists) { console.log('User not found:', uid); process.exit(0); }
            const before = doc.data();
            console.log('BEFORE: fcmDevices entries:', Object.keys(before.fcmDevices || {}).length, '| fcmTokens:', (before.fcmTokens || []).length);
            await db.collection('users').doc(uid).update({
              fcmDevices: admin.firestore.FieldValue.delete(),
              fcmTokens: admin.firestore.FieldValue.delete(),
            });
            const after = (await db.collection('users').doc(uid).get()).data();
            console.log('AFTER:  fcmDevices entries:', Object.keys(after.fcmDevices || {}).length, '| fcmTokens:', (after.fcmTokens || []).length);
            console.log('OK reset for uid', uid);
            process.exit(0);
          }).catch(e => { console.error('Error:', e.message); process.exit(1); });
          "
