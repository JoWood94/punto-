name: Send Notification to All Users

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Notification title'
        required: true
        default: 'punto! — Aggiornamento'
      body:
        description: 'Notification body (changelog)'
        required: true
        default: 'Nuova versione disponibile. Chiudi e riapri l app per aggiornare.'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: server
      - run: node send-notif-all-users.js
        working-directory: server
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NOTIF_TITLE: ${{ inputs.title }}
          NOTIF_BODY: ${{ inputs.body }}
