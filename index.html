    <!-- No-FOUC: apply theme class before any paint.
         Runs synchronously in <head> before body renders. -->
    <script>
      (function () {
        var mode = localStorage.getItem('themeMode') || 'auto';
        var isDark =
          mode === 'dark' ||
          (mode === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) {
          document.documentElement.classList.add('dark-theme');
          document.documentElement.style.colorScheme = 'dark';
        }
      })();
    </script>
    <style>
      /* Splash screen: adapts immediately via CSS since .dark-theme is already
         on <html> when this rule runs (set by the inline script above). */
      #splash-screen {
        position: fixed;
        inset: 0;
        background: #FFFBFE;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.35s ease;
      }
      html.dark-theme #splash-screen {
        background: #000000;
      }
      #splash-screen.splash-hidden {
        opacity: 0;
        pointer-events: none;
      }
      #splash-screen svg {
        width: 200px;
        height: auto;

      #splash-screen .splash-logo-fill {

        fill: #FFFBFE;
