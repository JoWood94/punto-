<ng-container *ngIf="visible">
  <!-- Scrim trasparente per click-away (coerente con create-fab) -->
  <div class="snooze-scrim" (click)="dismiss()"></div>

  <div class="snooze-stack" [class.snooze-stack--custom]="showCustom">

    <!-- Stack principale: pill floating. Hidden quando il picker custom è aperto. -->
    <ng-container *ngIf="!showCustom">

      <!-- Status chip (informativa, non interattiva) -->
      <div class="snooze-pill snooze-pill--status" *ngIf="isMuted">
        <mat-icon>notifications_off</mat-icon>
        <span>{{ 'SNOOZE.STATUS_MUTED' | translate }}</span>
      </div>
      <div class="snooze-pill snooze-pill--status" *ngIf="!isMuted && isSnoozedActive">
        <mat-icon>notifications_paused</mat-icon>
        <span>{{ 'SNOOZE.STATUS_SNOOZED_UNTIL' | translate }} {{ currentState?.snoozedUntil | date:'HH:mm':'':translationService.pipeDateLocale }}</span>
      </div>

      <!-- Riattiva: pill inversa (chiara) per evidenziare azione di uscita -->
      <button
        *ngIf="canReactivate"
        class="snooze-pill snooze-pill--reactivate"
        type="button"
        (click)="reactivateNow()">
        <mat-icon>notifications_active</mat-icon>
        <span>{{ 'SNOOZE.REACTIVATE' | translate }}</span>
      </button>

      <!-- Preset rapidi -->
      <button
        *ngFor="let preset of presets"
        class="snooze-pill"
        type="button"
        (click)="select(preset)">
        <mat-icon>snooze</mat-icon>
        <span>{{ preset.labelKey | translate }}</span>
      </button>

      <!-- Data/ora custom: apre overlay secondario -->
      <button class="snooze-pill" type="button" (click)="toggleCustom()">
        <mat-icon>event</mat-icon>
        <span>{{ 'SNOOZE.CUSTOM' | translate }}</span>
      </button>

      <!-- Silenzia sempre: accento rosso su icona+label -->
      <button
        *ngIf="!isMuted"
        class="snooze-pill snooze-pill--danger"
        type="button"
        (click)="mute()">
        <mat-icon>notifications_off</mat-icon>
        <span>{{ 'SNOOZE.MUTE_ALWAYS' | translate }}</span>
      </button>

    </ng-container>

    <!-- Custom datetime picker overlay (secondo step) -->
    <div class="snooze-custom-overlay" *ngIf="showCustom">
      <app-datetime-picker
        [value]="customDate"
        [minuteStep]="1"
        [minDate]="tomorrowMinDate"
        (valueChange)="onCustomDateChange($event)">
      </app-datetime-picker>
      <div class="snooze-custom-actions">
        <button class="snooze-pill snooze-pill--ghost" type="button" (click)="toggleCustom()">
          {{ 'SNOOZE.CANCEL' | translate }}
        </button>
        <button
          class="snooze-pill snooze-pill--primary"
          type="button"
          [disabled]="!customDate"
          (click)="confirmCustom()">
          {{ 'SNOOZE.CUSTOM_CONFIRM' | translate }}
        </button>
      </div>
    </div>

  </div>
</ng-container>
