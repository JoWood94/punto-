<ng-container *ngIf="rendering">
  <!-- Click-away gestito via capture-phase document listener (no scrim, robusto
       dentro mat-sidenav-content transformed). -->

  <div
    class="snooze-stack"
    [class.snooze-stack--leaving]="leaving"
    role="menu"
    [attr.aria-label]="'SNOOZE.OPEN_LABEL' | translate">

    <!-- Riattiva: pill inversa (chiara) per evidenziare azione di uscita -->
    <button
      *ngIf="canReactivate"
      #pillBtn
      class="snooze-pill snooze-pill--reactivate"
      type="button"
      role="menuitem"
      (click)="reactivateNow()">
      <mat-icon>notifications_active</mat-icon>
      <span>{{ 'SNOOZE.REACTIVATE' | translate }}</span>
    </button>

    <!-- Preset rapidi (icona schedule = orologio, niente "sveglia") -->
    <button
      *ngFor="let preset of presets"
      #pillBtn
      class="snooze-pill"
      type="button"
      role="menuitem"
      (click)="select(preset)">
      <mat-icon>schedule</mat-icon>
      <span>{{ preset.labelKey | translate }}</span>
    </button>

    <!-- Silenzia sempre: azione immediata (reversibile via Riattiva) -->
    <button
      *ngIf="!isMuted"
      #pillBtn
      class="snooze-pill snooze-pill--danger"
      type="button"
      role="menuitem"
      [attr.aria-label]="'SNOOZE.MUTE_ALWAYS' | translate"
      (click)="mute()">
      <mat-icon>notifications_off</mat-icon>
      <span>{{ 'SNOOZE.MUTE_ALWAYS' | translate }}</span>
    </button>

  </div>
</ng-container>
