<h2 mat-dialog-title>
  <mat-icon class="dialog-title-icon">link</mat-icon>
  {{ 'LINK_DIALOG.TITLE' | translate }}
</h2>

<mat-dialog-content>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>{{ 'LINK_DIALOG.URL_LABEL' | translate }}</mat-label>
    <input matInput type="url" [(ngModel)]="data.url"
           #urlInput
           placeholder="https://…"
           (paste)="onUrlPaste($event)"
           required>
    <mat-icon matSuffix>public</mat-icon>
    <mat-error *ngIf="!data.url.trim()">{{ 'LINK_DIALOG.URL_REQUIRED' | translate }}</mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>{{ 'LINK_DIALOG.DISPLAY_LABEL' | translate }}</mat-label>
    <input matInput [(ngModel)]="data.label"
           [placeholder]="'LINK_DIALOG.DISPLAY_PLACEHOLDER' | translate">
    <mat-hint>{{ 'LINK_DIALOG.DISPLAY_HINT' | translate }}</mat-hint>
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="dialogRef.close(null)">{{ 'COMMON.CANCEL' | translate }}</button>
  <button mat-flat-button color="primary"
          [disabled]="!data.url.trim()"
          (click)="confirm()">
    <mat-icon>check</mat-icon> {{ 'COMMON.CONFIRM' | translate }}
  </button>
</mat-dialog-actions>
